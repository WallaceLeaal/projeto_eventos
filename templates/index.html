<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Eventos Acadêmicos</title>
</head>
<body>
    <h1>Eventos Acadêmicos</h1>

<form id="formEvento" method="post">
    <input id="nome" name="nome" placeholder="Nome" required>
    <input id="data" name="data" placeholder="Data (AAAA-MM-DD)" required>
    <input id="local" name="local" placeholder="Local">
    <input id="vagas" name="vagas" type="number" placeholder="Vagas">
    <button type="submit">Cadastrar</button>
</form>

    <ul id="listaEventos">
        {% for e in eventos %}
            <li>
                {{ e.nome }} — {{ e.data }} — {{ e.local }} ({{ e.vagas }} vagas)
                <a href="/editar/{{ e.id }}">editar</a>
                <a href="/excluir/{{ e.id }}">excluir</a>
            </li>
        {% endfor %}
    </ul>
    
    <script src="{{ url_for('static', filename='eventos.js') }}"></script>
</body>
</html>
